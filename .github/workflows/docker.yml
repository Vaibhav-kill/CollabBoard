name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Server Image
        run: |
          docker build -t vai14/collabboard-server:latest ./server

      - name: Build Client Image
        run: |
          docker build \
            --build-arg VITE_API_URL=https://collabboard-server-latest.onrender.com \
            -t vai14/collabboard-client:latest ./client

      - name: Push Server Image
        run: |
          docker push vai14/collabboard-server:latest

      - name: Push Client Image
        run: |
          docker push vai14/collabboard-client:latest

      - name: Deploy Server to Render
        run: |
          curl -X POST "${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}"

      - name: Deploy Client to Render
        run: |
          curl -X POST "${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}"